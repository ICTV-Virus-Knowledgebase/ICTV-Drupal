services:
  ictv_seqsearch_service.GetOutputFile:
    class: '\Drupal\ictv_seqsearch_service\Plugin\rest\resource\GetOutputFile'
    arguments: ['@current_user']
    tags:
      - { name: 'rest.resource' }

  ictv_seqsearch_service.GetSeqSearchJob:
    class: '\Drupal\ictv_seqsearch_service\Plugin\rest\resource\GetSeqSearchJob'
    arguments: ['@current_user']
    tags:
      - { name: 'rest.resource' }

  ictv_seqsearch_service.UploadSequences:
    class: '\Drupal\ictv_seqsearch_service\Plugin\rest\resource\UploadSequences'
    arguments: ['@current_user']
    tags:
      - { name: 'rest.resource' }