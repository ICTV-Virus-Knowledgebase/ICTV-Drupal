services:
  ictv_web_api.searchTaxonomy:
    class: '\Drupal\ictv_web_api\Plugin\rest\resource\SearchTaxonomy'
    arguments: ['@current_user']
    tags:
      - { name: 'rest.resource' }

  ictv_web_api.getChildTaxa:
    class: '\Drupal\ictv_web_api\Plugin\rest\resource\GetChildTaxa'
    arguments: ['@current_user']
    tags:
      - { name: 'rest.resource' }

  ictv_web_api.getTaxaByName:
    class: '\Drupal\ictv_web_api\Plugin\rest\resource\GetTaxaByName'
    arguments: ['@current_user']
    tags:
      - { name: 'rest.resource' }

  ictv_web_api.getUnassignedChildTaxaByName:
    class: '\Drupal\ictv_web_api\Plugin\rest\resource\GetUnassignedChildTaxaByName'
    arguments: ['@current_user']
    tags:
      - { name: 'rest.resource' }

  ictv_web_api.getReleaseTaxa:
    class: '\Drupal\ictv_web_api\Plugin\rest\resource\GetReleaseTaxa'
    arguments: ['@current_user']
    tags:
      - { name: 'rest.resource' }

  ictv_web_api.getTaxonDetails:
    class: '\Drupal\ictv_web_api\Plugin\rest\resource\GetTaxonDetails'
    arguments: ['@current_user']
    tags:
      - { name: 'rest.resource' }

  ictv_web_api.getMslRelease:
    class: '\Drupal\ictv_web_api\Plugin\rest\resource\GetMslRelease'
    arguments: ['@current_user']
    tags:
      - { name: 'rest.resource' }

  ictv_web_api.getReleaseHistory:
    class: '\Drupal\ictv_web_api\Plugin\rest\resource\GetReleaseHistory'
    arguments: ['@current_user']
    tags:
      - { name: 'rest.resource' }

  ictv_web_api.getVirusIsolates:
    class: '\Drupal\ictv_web_api\Plugin\rest\resource\GetVirusIsolates'
    arguments: ['@current_user']
    tags:
      - { name: 'rest.resource' }

  ictv_web_api.getTaxonHistory:
    class: '\Drupal\ictv_web_api\Plugin\rest\resource\GetTaxonHistory'
    arguments: ['@current_user']
    tags:
      - { name: 'rest.resource' }

  ictv_web_api.getByReleasePreExpanded:
    class: '\Drupal\ictv_web_api\Plugin\rest\resource\GetByReleasePreExpanded'
    arguments: ['@current_user']
    tags:
      - { name: 'rest.resource' }

  ictv_web_api.getTreeExpandedToNode:
    class: '\Drupal\ictv_web_api\Plugin\rest\resource\GetTreeExpandedToNode'
    arguments: ['@current_user']
    tags:
      - { name: 'rest.resource' }

  #--- NEW: subscriber that disables page-cache for that route ---
  ictv_web_api.no_page_cache_subscriber:
    class: 'Drupal\ictv_web_api\EventSubscriber\NoPageCacheSubscriber'
    arguments: ['@page_cache_kill_switch']
    tags:
      - { name: event_subscriber }